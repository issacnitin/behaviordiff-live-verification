name: BehaviorDiff annotation experiment
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Pull request head SHA
        required: true
permissions:
  contents: read
  checks: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'BehaviorDiff out-of-diff annotation experiment',
              head_sha: context.payload.inputs.head_sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Out-of-diff annotation visibility experiment',
                summary: 'Temporary experiment requested to verify where GitHub renders annotations on files outside a pull request diff.',
                annotations: [{
                  path: 'samples/SampleApp/RetryPolicy.cs',
                  start_line: 18,
                  end_line: 18,
                  annotation_level: 'warning',
                  message: 'Visibility experiment: this unchanged file contains the downstream behavior finding.'
                }]
              }
            });
            core.notice(`CHECK_ID=${check.data.id}`);